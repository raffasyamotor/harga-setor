<!DOCTYPE html>
<html lang="id" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8" />
    <!-- Dioptimalkan: Menambahkan viewport-fit=cover untuk layar modern -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sales Hub - Raffasya Motor</title>
    
    <!-- PWA Meta Tags & Manifest -->
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sales Hub">
    <link rel="apple-touch-icon" href="https://i.imgur.com/e6UEZvP.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Sales Hub - Raffasya Motor","short_name":"Sales Hub","start_url":".","display":"standalone","background_color":"#f4f7fa","theme_color":"#ffffff","icons":[{"src":"https://i.imgur.com/e6UEZvP.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"https://i.imgur.com/e6UEZvP.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8247290737950345" crossorigin="anonymous"></script>
    <style>
        /* Dioptimalkan: Pencegahan mutlak horizontal scrolling di level root */
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            width: 100%;
        }

        body { 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f4f7fa;
        }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .status-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .READY { background: #eefdf3; color: #15803d; border: 1px solid #bbf7d0; }
        .BOOKING { background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe; }
        .TERJUAL { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; }
        .COMING-SOON { 
            background: #fffbeb; 
            color: #b45309; 
            border: 1px solid #fef3c7; 
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .price-text {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-sheet { animation: slideUp 0.3s cubic-bezier(0, 0, 0.2, 1); }

        #copyToast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>

<!-- Dioptimalkan: Class Tailwind w-full, max-w-[100vw], overflow-x-hidden dipastikan ada -->
<body class="min-h-screen pb-12 w-full max-w-[100vw] overflow-x-hidden">
    <div id="copyToast">Data unit berhasil disalin!</div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 px-5 py-4 w-full">
        <div class="max-w-4xl mx-auto flex justify-between items-center w-full">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                </div>
                <div class="min-w-0">
                    <h1 class="text-base font-bold text-gray-900 leading-none truncate">Sales Hub</h1>
                    <p class="text-[10px] text-gray-400 font-bold mt-1 uppercase tracking-widest truncate">Raffasya Motor</p>
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <!-- Tombol Install PWA Dinamis -->
                <button id="installAppBtn" class="hidden bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider flex items-center gap-1.5 border border-blue-100 active:scale-95 transition-transform shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4-4m0 0l-4-4m4 4V4" />
                    </svg>
                    APP
                </button>
                <div class="text-right">
                    <div id="lastUpdate" class="text-[11px] font-black text-blue-600">--:--</div>
                    <div id="refreshTimer" class="text-[9px] text-gray-400 font-medium">Syncing...</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Dioptimalkan: Pastikan w-full -->
    <main class="max-w-4xl w-full mx-auto px-4 pt-6">
        <!-- Pencarian & Filter Terintegrasi -->
        <div class="mb-6 w-full relative">
            <div class="relative group flex items-center w-full">
                <input id="searchInput" type="text" placeholder="Cari tipe mobil atau plat nomor..."
                    class="w-full bg-white border-2 border-transparent rounded-2xl pl-12 pr-24 py-4 focus:border-blue-500/20 focus:ring-4 focus:ring-blue-500/5 outline-none transition-all text-sm font-semibold shadow-sm" />
                
                <!-- Ikon Kaca Pembesar -->
                <div class="absolute inset-y-0 left-4 flex items-center text-gray-400 group-focus-within:text-blue-500 transition-colors pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>

                <!-- Modul Filter & Sort dalam Kolom Search -->
                <div class="absolute inset-y-0 right-2 flex items-center gap-1">
                    
                    <!-- Filter Status -->
                    <div class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-gray-50/80 text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="Filter Status">
                        <select id="filterStatus" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                            <option value="">Semua Status</option>
                            <option value="READY">Unit Ready</option>
                            <option value="BOOKING">Sudah Booking</option>
                            <option value="COMING SOON">COMING SOON</option>
                            <option value="TERJUAL">Sudah Terjual</option>
                        </select>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                        </svg>
                    </div>

                    <!-- Filter Urut Harga -->
                    <div class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-gray-50/80 text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="Urut Harga">
                        <select id="sortPrice" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                            <option value="">Urut Harga</option>
                            <option value="asc">Harga Terendah</option>
                            <option value="desc">Harga Tertinggi</option>
                        </select>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                        </svg>
                    </div>

                </div>
            </div>
        </div>

        <!-- Ringkasan Status -->
        <!-- Dioptimalkan: Tambah w-full max-w-full agar list scroll horizontal tidak memaksa layout utama melebar -->
        <div id="totalInfo" class="flex gap-2 overflow-x-auto no-scrollbar pb-6 w-full max-w-full snap-x"></div>

        <!-- DAFTAR UNIT -->
        <div id="mobilList" class="space-y-6 w-full"></div>

        <!-- Loading -->
        <div id="loading" class="flex flex-col justify-center items-center my-12 hidden w-full">
            <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <div id="endMessage" class="text-center text-gray-400 text-[10px] py-12 hidden font-black uppercase tracking-[0.3em] w-full">Katalog Terupdate</div>
    </main>

    <!-- MODAL DETAIL -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 z-[60] hidden items-end justify-center px-0">
        <div class="bg-white rounded-t-[40px] w-full max-w-xl relative overflow-hidden modal-sheet max-h-[95vh] flex flex-col mx-auto">
            <div class="absolute top-4 right-5 z-[100]">
                <button id="closeModalInner" class="bg-white/20 backdrop-blur-md rounded-full w-10 h-10 flex items-center justify-center text-white border border-white/30 shadow-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="overflow-y-auto overflow-x-hidden w-full no-scrollbar"></div>
        </div>
    </div>

    <!-- MODAL PANDUAN INSTALL iOS -->
    <div id="iosInstallModal" class="fixed inset-0 bg-black/80 z-[70] hidden items-end justify-center">
        <div class="bg-white rounded-t-[40px] w-full max-w-xl p-8 relative modal-sheet flex flex-col items-center text-center mx-auto">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mb-6"></div>
            <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 mb-5 shadow-inner border border-blue-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
            </div>
            <h3 class="text-xl font-black text-gray-900 mb-3 leading-tight">Install Aplikasi di <br/>iPhone / iPad</h3>
            <div class="text-[13px] text-gray-500 mb-8 leading-relaxed space-y-3">
                <p>1. Ketuk ikon <strong class="text-gray-800">Bagikan (Share)</strong> di menu bawah browser Anda.</p>
                <p>2. Geser ke bawah dan pilih <br/><strong class="text-blue-600 bg-blue-50 px-2 py-1 rounded-md inline-block mt-1">"Tambah ke Layar Utama"</strong></p>
            </div>
            <button id="closeIosModal" class="w-full bg-blue-600 text-white rounded-[24px] py-4 font-black text-sm shadow-xl shadow-blue-100 active:scale-95 transition uppercase tracking-widest">
                Saya Mengerti
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    const apiURL = "https://script.google.com/macros/s/AKfycbzAUJoXVfBsY-WrJHieFZzXb9Bv77rg8sAq-pzH4DMlrR4gmkobAC7Ki1ulF77ZRSj_fA/exec";
    const REFRESH_INTERVAL = 15 * 1000; 
    
    let selectedStatus = "";
    let allData = [], filteredData = [];
    let currentSort = "", searchText = "";
    let perLoad = 10, currentIndex = 0, isLoading = false;
    
    const listContainer = document.getElementById("mobilList");
    const loading = document.getElementById("loading");
    const endMessage = document.getElementById("endMessage");
    const searchInput = document.getElementById("searchInput");
    const sortPrice = document.getElementById("sortPrice");
    const detailModal = document.getElementById("detailModal");
    const modalContent = document.getElementById("modalContent");
    const totalInfo = document.getElementById("totalInfo");
    const filterStatus = document.getElementById("filterStatus");
    const lastUpdateEl = document.getElementById("lastUpdate");
    const refreshTimerEl = document.getElementById("refreshTimer");

    const F = {
        get(obj, ...keys) {
            for (const k of keys) {
                if (obj && obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== "") return obj[k];
            }
            return "";
        },
        normStatus(v) { return String(v || "").trim().toUpperCase(); },
        parseRupiahToInt(v) {
            const num = parseInt(String(v || "").replace(/[^\d]/g, ""), 10);
            return isNaN(num) ? 0 : num;
        },
        formatFullRupiah(v) {
            const n = this.parseRupiahToInt(v);
            return n ? "Rp " + n.toLocaleString("id-ID") : "Rp -";
        },
        formatKM(v) {
            if (!v) return "-";
            const num = parseInt(String(v).replace(/[^\d]/g, ""), 10);
            return isNaN(num) ? "-" : num.toLocaleString("id-ID") + " km";
        }
    };

    function keyMap(item, index) {
        const nama = F.get(item, 'MERK/TYPE MOBIL', 'MERK / TYPE MOBIL', 'MERK & TYPE', 'MERK', 'TYPE', 'NAMA', 'NAMA MOBIL');
        const nopol = F.get(item, 'NOPOL', 'NO POL', 'PLAT', 'PLAT NOMOR');
        const harga = F.get(item, 'HARGA JUAL (OTR)', 'HARGA OTR', 'HARGA', 'PRICE');
        const warna = F.get(item, 'WARNA');
        const status = F.normStatus(F.get(item, 'STATUS', 'Status', 'status'));
        const bulan = F.get(item, 'BULAN', 'Bulan', 'bulan');
        const km = F.get(item, 'KM', 'KILOMETER', 'ODOMETER', 'JARAK TEMPUH');
        const linkPhoto = F.get(item, 'LINK PHOTO', 'FOTO', 'PHOTO');
        const bank = {
            MUF: F.get(item, 'MUF'), ADIRA: F.get(item, 'ADIRA'), OTO: F.get(item, 'OTO'),
            SINARMAS: F.get(item, 'SINARMAS'), 'WOORI': F.get(item, 'WOORI FINANCE'), 'CIMB': F.get(item, 'CIMB NIAGA', 'CIMB')
        };
        const photos = [];
        if (linkPhoto) photos.push(linkPhoto);
        for (let j = 1; j <= 10; j++) {
            const v = F.get(item, `PHOTO ${j}`);
            if (v) photos.push(v);
        }
        return { nama, nopol, warna, harga, status, bulan, km, bank, photos, rawIndex: index };
    }

    function applyFilter() {
        const source = allData.map((item, idx) => keyMap(item, idx));
        filteredData = source.filter(x => {
            const search = searchText.toLowerCase();
            const matchSearch = x.nama.toLowerCase().includes(search) || x.nopol.toLowerCase().includes(search);
            const matchStatus = selectedStatus === "" || x.status === selectedStatus;
            return matchSearch && matchStatus;
        });

        if (currentSort) {
            filteredData.sort((a, b) => {
                const A = F.parseRupiahToInt(a.harga);
                const B = F.parseRupiahToInt(b.harga);
                return currentSort === "asc" ? A - B : B - A;
            });
        }

        const ready = filteredData.filter(x => x.status === 'READY').length;
        const booking = filteredData.filter(x => x.status === 'BOOKING').length;
        const comingsoon = filteredData.filter(x => x.status === 'COMING SOON').length;

        totalInfo.innerHTML = `
            <div class="READY status-badge shadow-sm whitespace-nowrap shrink-0 snap-start">READY ${ready}</div>
            <div class="BOOKING status-badge shadow-sm whitespace-nowrap shrink-0 snap-start">BOOKING ${booking}</div>
            <div class="COMING SOON status-badge shadow-sm whitespace-nowrap shrink-0 snap-start">COMING SOON ${comingsoon}</div>
        `;

        listContainer.innerHTML = "";
        currentIndex = 0;
        endMessage.classList.add("hidden");
        loadMore();
    }

    function loadMore() {
        if (isLoading) return;
        isLoading = true;
        loading.classList.remove("hidden");

        const nextData = filteredData.slice(currentIndex, currentIndex + perLoad);
        
        nextData.forEach((item) => {
            const card = document.createElement("div");
            card.className = "bg-white rounded-3xl overflow-hidden border border-gray-100 shadow-xl shadow-blue-900/5 p-4 sm:p-5 flex flex-col gap-4 w-full";
            
            const photo = item.photos[0] || "https://via.placeholder.com/400x300?text=No+Photo";
            const leasingEntries = Object.entries(item.bank).filter(([_, v]) => v);
            const leasingListHtml = leasingEntries.length > 0 
                ? leasingEntries.map(([n, v]) => `
                    <div class="flex justify-between items-center py-1.5 border-b border-gray-50 last:border-0 gap-2">
                        <span class="text-[10px] font-black text-blue-700 uppercase tracking-tighter shrink-0">${n}</span>
                        <span class="text-[11px] font-bold text-gray-700 text-right break-words">${v}</span>
                    </div>`).join("")
                : `<p class="text-[10px] text-gray-400 font-bold italic py-2">Estimasi leasing menyusul...</p>`;

            card.innerHTML = `
                <div class="flex gap-4 items-start cursor-pointer" onclick="showModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                    <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gray-50 shrink-0 overflow-hidden border border-gray-100 shadow-inner">
                        <img data-src="${photo}" class="lazy-image w-full h-full object-cover opacity-0 transition-opacity duration-500" />
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1.5 gap-2">
                            <span class="status-badge ${item.status} shrink-0">${item.status}</span>
                            <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest truncate">${item.nopol || '-'}</span>
                        </div>
                        <h2 class="text-[14px] font-black text-gray-900 uppercase leading-tight line-clamp-2 mb-1.5 break-words">${item.nama || 'Unit'}</h2>
                        
                        <div class="flex items-center gap-2 mb-2 flex-wrap sm:flex-nowrap">
                            <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest border-r border-gray-200 pr-2 truncate max-w-[100px]">Warna: ${item.warna || '-'}</span>
                            <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest flex items-center gap-1 shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m12 14 4-4"/>
                                    <path d="M3.34 16a10 10 0 1 1 17.32 0"/>
                                </svg>
                                ${F.formatKM(item.km)} (on going)
                            </span>
                        </div>
                        
                        <div class="price-text text-lg sm:text-xl font-black truncate">${F.formatFullRupiah(item.harga)}</div>
                    </div>
                </div>

                <div class="bg-gray-50/50 rounded-2xl p-4 border border-gray-100 w-full overflow-hidden">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-1 h-3 bg-blue-600 rounded-full shrink-0"></div>
                        <h3 class="text-[9px] font-black text-gray-400 uppercase tracking-widest truncate">Estimasi Leasing</h3>
                    </div>
                    <div class="flex flex-col">${leasingListHtml}</div>
                </div>

                <div class="grid grid-cols-2 gap-2 sm:gap-3 mt-1 w-full">
                    <button class="bg-blue-50 text-blue-700 py-3.5 rounded-2xl text-[9px] sm:text-[10px] font-black uppercase tracking-[0.15em] flex items-center justify-center gap-1.5 active:scale-95 transition" onclick="copyUnit(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 sm:h-4 sm:w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2" />
                        </svg> SALIN DATA
                    </button>
                    <button class="bg-blue-600 text-white py-3.5 rounded-2xl text-[9px] sm:text-[10px] font-black uppercase tracking-[0.15em] flex items-center justify-center gap-1.5 shadow-lg shadow-blue-100 active:scale-95 transition" onclick="shareUnit(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 sm:h-4 sm:w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                        </svg> BAGIKAN
                    </button>
                </div>
            `;
            listContainer.appendChild(card);
        });

        initLazyLoad();
        currentIndex += perLoad;
        isLoading = false;
        loading.classList.add("hidden");

        if (currentIndex >= filteredData.length && filteredData.length > 0) {
            endMessage.classList.remove("hidden");
        }
    }

    function initLazyLoad() {
        const lazyImages = document.querySelectorAll("img.lazy-image");
        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    img.onload = () => img.classList.add("opacity-100");
                    obs.unobserve(img);
                }
            });
        }, { rootMargin: "200px" });
        lazyImages.forEach(img => observer.observe(img));
    }

    function showModal(item) {
        const slides = item.photos.map(src => `
            <div class="swiper-slide h-[300px] sm:h-[350px] bg-gray-50 w-full">
                <img data-src="${src}" class="lazy-image object-cover w-full h-full" />
            </div>
        `);

        modalContent.innerHTML = `
            <div class="relative pb-12 bg-white w-full overflow-x-hidden">
                <div class="swiper galeriSales w-full">
                    <div class="swiper-wrapper w-full">${slides.length ? slides.join("") : '<div class="swiper-slide h-[300px] flex items-center justify-center bg-gray-100 text-gray-400 text-[10px] font-black uppercase tracking-widest w-full">Foto Tidak Tersedia</div>'}</div>
                    <div class="swiper-pagination"></div>
                </div>

                <div class="px-6 sm:px-8 pt-8 w-full">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="status-badge ${item.status}">${item.status}</span>
                        <div class="h-3 w-[1px] bg-gray-200"></div>
                        <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest truncate">Detail Katalog</span>
                    </div>
                    
                    <h2 class="text-xl sm:text-2xl font-black text-gray-900 uppercase leading-none mb-3 break-words">${item.nama || '-'}</h2>
                    
                    <div class="flex items-center gap-2 mb-6 flex-wrap">
                        <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest border-r border-gray-200 pr-2 truncate">Warna: ${item.warna || '-'}</span>
                        <span class="text-[9px] font-black text-gray-500 uppercase tracking-widest flex items-center gap-1 shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m12 14 4-4"/>
                                <path d="M3.34 16a10 10 0 1 1 17.32 0"/>
                            </svg>
                            ${F.formatKM(item.km)} (on going)
                        </span>
                    </div>
                    
                    <div class="bg-blue-600 p-6 sm:p-8 rounded-[32px] text-white shadow-2xl shadow-blue-200 mb-8 relative overflow-hidden w-full">
                        <div class="absolute top-0 right-0 p-4 opacity-10">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <p class="text-[11px] font-black text-blue-100 uppercase tracking-[0.2em] mb-2">Harga Jual OTR</p>
                        <div class="text-3xl sm:text-4xl font-black truncate">${F.formatFullRupiah(item.harga)}</div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-10 w-full">
                        <div class="bg-gray-50 p-4 sm:p-5 rounded-3xl border border-gray-100 w-full overflow-hidden">
                            <p class="text-[9px] font-black text-gray-400 uppercase mb-1 tracking-widest truncate">NOPOL</p>
                            <p class="text-sm sm:text-base font-black text-gray-900 uppercase truncate">${item.nopol || '-'}</p>
                        </div>
                        <div class="bg-gray-50 p-4 sm:p-5 rounded-3xl border border-gray-100 w-full overflow-hidden">
                            <p class="text-[9px] font-black text-gray-400 uppercase mb-1 tracking-widest truncate">BULAN</p>
                            <p class="text-sm sm:text-base font-black text-gray-900 uppercase truncate">${item.bulan || '-'}</p>
                        </div>
                    </div>
                    
                    <div class="mb-12 w-full">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-2 h-5 bg-blue-600 rounded-full shrink-0"></div>
                            <h3 class="text-xs font-black text-gray-900 uppercase tracking-[0.2em] truncate">Estimasi Cicilan</h3>
                        </div>
                        <div class="space-y-3 sm:space-y-4 w-full">
                            ${Object.entries(item.bank).map(([name, val]) => val ? `
                                <div class="flex justify-between items-center bg-white p-4 sm:p-5 rounded-3xl border border-gray-100 shadow-sm w-full gap-2">
                                    <span class="text-[11px] sm:text-xs font-black text-blue-700 uppercase tracking-widest shrink-0">${name}</span>
                                    <span class="text-[12px] sm:text-[13px] font-black text-gray-800 text-right break-words">${val}</span>
                                </div>
                            ` : '').join('')}
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 sm:gap-4 w-full">
                        <button class="w-full bg-blue-600 text-white rounded-[24px] py-4 sm:py-5 font-black text-xs sm:text-sm shadow-xl shadow-blue-100 active:scale-95 transition flex items-center justify-center gap-3 uppercase tracking-widest truncate px-4" onclick="shareUnit(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                             Bagikan Katalog Unit
                        </button>
                        <button class="w-full bg-gray-100 text-gray-600 rounded-[24px] py-3.5 sm:py-4 font-black text-[10px] sm:text-[11px] flex items-center justify-center gap-3 uppercase tracking-widest truncate px-4" onclick="copyUnit(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                             Salin Detail Unit
                        </button>
                    </div>
                </div>
            </div>
        `;

        document.getElementById("closeModalInner").onclick = hideModal;
        detailModal.onclick = (e) => { if (e.target === detailModal) hideModal(); };

        new Swiper('.galeriSales', { 
            slidesPerView: 1, 
            pagination: { el: '.swiper-pagination', clickable: true },
            observer: true,
            observeParents: true
        });

        detailModal.classList.remove("hidden");
        detailModal.classList.add("flex");
        initLazyLoad();
    }

    function hideModal() {
        detailModal.classList.add("hidden");
        detailModal.classList.remove("flex");
    }

    // FUNGSI SHARE NATIVE
    async function shareUnit(item) {
        let creditText = "";
        Object.entries(item.bank).forEach(([bankName, val]) => {
            if (val) creditText += `\n- ${bankName}: ${val}`;
        });

        const shareData = {
            title: 'Katalog Raffasya Motor',
            text: `*RAFFASYA MOTOR SUBANG*\n\nUnit: *${item.nama}*\n*${item.warna}*\nKilometer: *${F.formatKM(item.km)} (on going)*\nHarga OTR: *${F.formatFullRupiah(item.harga)}*\nNopol: ${item.nopol || '-'}\n\n*ESTIMASI CICILAN:*${creditText || '\n- Hubungi kami untuk detail'}\n\nInfo lanjut hubungi kami segera!`
        };

        if (navigator.share) {
            try {
                await navigator.share(shareData);
            } catch (err) {}
        } else {
            window.open(`https://wa.me/?text=${encodeURIComponent(shareData.text)}`, '_blank');
        }
    }

    function copyUnit(item) {
        let creditText = "";
        Object.entries(item.bank).forEach(([bankName, val]) => {
            if (val) creditText += `\n- ${bankName}: ${val}`;
        });

        const text = `RAFFASYA MOTOR SUBANG\n\nUnit: ${item.nama}\n${item.warna}\nKilometer: ${F.formatKM(item.km)} (on going)\nHarga: ${F.formatFullRupiah(item.harga)}\nNopol: ${item.nopol || '-'}\n\nEstimasi Cicilan:${creditText || '\n- Segera Hubungi Sales'}`;
        
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        
        const toast = document.getElementById("copyToast");
        toast.style.opacity = "1";
        setTimeout(() => { toast.style.opacity = "0"; }, 2000);
    }

    let refreshTimer;
    let countdown = REFRESH_INTERVAL / 1000;

    function startAutoRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        countdown = REFRESH_INTERVAL / 1000;
        refreshTimer = setInterval(() => {
            countdown--;
            if (refreshTimerEl) refreshTimerEl.innerText = `Refresh in ${countdown}s`;
            if (countdown <= 0) {
                fetchData(true); 
                countdown = REFRESH_INTERVAL / 1000;
            }
        }, 1000);
    }

    async function fetchData(isSilent = false) {
        const cachedData = localStorage.getItem('raffasya_data_cache');
        
        if (cachedData && !isSilent) {
            try {
                allData = JSON.parse(cachedData);
                applyFilter();
                if (refreshTimerEl) refreshTimerEl.innerText = "Memeriksa data baru...";
            } catch (e) {
                console.error("Gagal membaca cache:", e);
                loading.classList.remove("hidden");
            }
        } else if (!isSilent) {
            loading.classList.remove("hidden");
        }

        try {
            const res = await fetch(apiURL);
            const json = await res.json();
            const rows = Array.isArray(json) ? json : (json.data || json.records || []);
            
            const newData = rows.slice().reverse();
            
            localStorage.setItem('raffasya_data_cache', JSON.stringify(newData));
            
            allData = newData;
            const now = new Date();
            lastUpdateEl.innerText = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
        } catch (err) {
            console.error("Gagal update data:", err);
        } finally {
            applyFilter();
            if (!isSilent) loading.classList.add("hidden");
        }
    }

    window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
            if (currentIndex < filteredData.length) loadMore();
        }
    });

    searchInput.addEventListener("input", () => { searchText = searchInput.value; applyFilter(); });
    sortPrice.addEventListener("change", () => { currentSort = sortPrice.value; applyFilter(); });
    filterStatus.addEventListener("change", () => { selectedStatus = filterStatus.value; applyFilter(); });

    // --- PWA & LOGIKA INSTALL APLIKASI ---
    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');
    const iosInstallModal = document.getElementById('iosInstallModal');
    const closeIosModal = document.getElementById('closeIosModal');

    const isIos = () => {
        const userAgent = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    };

    const isInStandaloneMode = () => 
        ('standalone' in window.navigator && window.navigator.standalone) || 
        window.matchMedia('(display-mode: standalone)').matches;

    if ('serviceWorker' in navigator && !isInStandaloneMode()) {
        const swCode = "self.addEventListener('fetch', function() {}); self.addEventListener('install', function(e) { self.skipWaiting(); });";
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    if (installAppBtn) {
        installAppBtn.addEventListener('click', async () => {
            if (isIos()) {
                iosInstallModal.classList.remove('hidden');
                iosInstallModal.classList.add('flex');
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installAppBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
    }

    if (closeIosModal) {
        closeIosModal.addEventListener('click', () => {
            iosInstallModal.classList.add('hidden');
            iosInstallModal.classList.remove('flex');
        });
    }
    
    if (iosInstallModal) {
        iosInstallModal.addEventListener('click', (e) => {
            if (e.target === iosInstallModal) {
                iosInstallModal.classList.add('hidden');
                iosInstallModal.classList.remove('flex');
            }
        });
    }

    if (isIos() && !isInStandaloneMode() && installAppBtn) {
        installAppBtn.classList.remove('hidden');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installAppBtn && !isInStandaloneMode()) {
            installAppBtn.classList.remove('hidden');
        }
    });

    window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        if (installAppBtn) installAppBtn.classList.add('hidden');
    });

    fetchData();
    startAutoRefresh();
</script>
</body>
</html>
