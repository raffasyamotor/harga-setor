<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sales Hub - Raffasya Motor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #ffffff;
    }
    .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    
    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .READY { background: #eefdf3; color: #15803d; border: 1px solid #bbf7d0; }
    .BOOKING { background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe; }
    .TERJUAL { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; }
    
    .price-tag {
      background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-sheet { animation: slideUp 0.3s cubic-bezier(0, 0, 0.2, 1); }

    /* Custom Notification Style */
    #copyToast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* Swiper Pagination Style Overrides */
    .swiper-pagination-bullet-active {
      background: #2563eb !important;
    }
  </style>
</head>

<body class="min-h-screen pb-32">
  <div id="copyToast">Berhasil disalin ke clipboard!</div>

  <!-- Header Sales -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 px-5 py-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold text-gray-900 leading-none">Sales Dashboard</h1>
          <p class="text-[10px] text-gray-500 font-medium mt-1 uppercase tracking-wider">Raffasya Motor Subang</p>
        </div>
      </div>
      <div class="text-right">
        <div id="lastUpdate" class="text-[11px] font-bold text-blue-600">--:--</div>
        <div id="refreshTimer" class="text-[9px] text-gray-400">Syncing...</div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6">
    <!-- Search Tools -->
    <div class="mb-6">
      <div class="relative">
        <input id="searchInput" type="text" placeholder="Ketik Merk, Tipe, atau Plat..."
          class="w-full bg-gray-50 border border-gray-100 rounded-xl pl-11 pr-4 py-3.5 focus:bg-white focus:ring-2 focus:ring-blue-500/20 outline-none transition-all text-sm font-medium" />
        <div class="absolute inset-y-0 left-4 flex items-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Inventory Quick Stats -->
    <div id="totalInfo" class="flex gap-2 overflow-x-auto no-scrollbar pb-6"></div>

    <!-- INVENTORY LIST -->
    <div id="mobilList" class="space-y-4"></div>

    <!-- Loading -->
    <div id="loading" class="flex flex-col justify-center items-center my-12 hidden">
      <div class="w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div id="endMessage" class="text-center text-gray-400 text-[10px] py-10 hidden font-bold uppercase tracking-widest">Data Terupdate</div>
  </main>

  <!-- Sales Toolbelt (Bottom Nav) -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 safe-area-bottom shadow-[0_-10px_30px_rgba(0,0,0,0.03)]">
    <div class="max-w-lg mx-auto px-6 py-3 flex justify-between items-center">
      <!-- Catalog -->
      <button id="resetBtn" class="flex flex-col items-center gap-1 group">
        <div class="p-2 rounded-xl text-blue-600 bg-blue-50 group-active:scale-90 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
        </div>
        <span class="text-[10px] font-bold text-gray-600">KATALOG</span>
      </button>

      <!-- Filter -->
      <div class="relative flex flex-col items-center gap-1 group">
        <select id="filterStatus" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
          <option value="">Status</option>
          <option value="READY">Ready</option>
          <option value="BOOKING">Booking</option>
          <option value="TERJUAL">Terjual</option>
        </select>
        <div class="p-2 rounded-xl text-gray-400 group-hover:text-blue-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
        </div>
        <span class="text-[10px] font-bold text-gray-400">FILTER</span>
      </div>

      <!-- Sort -->
      <div class="relative flex flex-col items-center gap-1 group">
        <select id="sortPrice" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
          <option value="">Urutan</option>
          <option value="asc">Terendah</option>
          <option value="desc">Tertinggi</option>
        </select>
        <div class="p-2 rounded-xl text-gray-400 group-hover:text-blue-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
          </svg>
        </div>
        <span class="text-[10px] font-bold text-gray-400">HARGA</span>
      </div>
    </div>
  </nav>

  <!-- SALES DETAIL SHEET -->
  <div id="detailModal" class="fixed inset-0 bg-black/70 z-[60] hidden items-end justify-center">
    <div class="bg-white rounded-t-[32px] w-full max-w-xl relative overflow-hidden modal-sheet max-h-[95vh] flex flex-col shadow-2xl">
      <!-- Modal Header Overlay -->
      <div class="absolute top-0 left-0 right-0 h-16 bg-gradient-to-b from-black/40 to-transparent z-[70] pointer-events-none rounded-t-[32px]"></div>
      
      <!-- Drag Indicator -->
      <div class="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-white/40 rounded-full z-[80]"></div>
      
      <!-- Improved Close Button -->
      <button id="closeModalInner" class="absolute top-4 right-5 z-[100] bg-white/20 hover:bg-white/40 active:scale-90 backdrop-blur-md rounded-full w-9 h-9 flex items-center justify-center text-white transition-all shadow-lg border border-white/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <div id="modalContent" class="overflow-y-auto no-scrollbar"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
  const apiURL = "https://script.google.com/macros/s/AKfycbyr5QyBndUGqeyKgpwRwDDp8g7LnBbvMdpEGadYPWHRtlph9MmwZXgNwP487NtwioZM/exec";
  const REFRESH_INTERVAL = 59 * 1000; 
  
  let selectedStatus = "";
  let allData = [], filteredData = [];
  let currentSort = "", searchText = "";
  let perLoad = 10, currentIndex = 0, isLoading = false;
  
  const listContainer = document.getElementById("mobilList");
  const loading = document.getElementById("loading");
  const endMessage = document.getElementById("endMessage");
  const searchInput = document.getElementById("searchInput");
  const sortPrice = document.getElementById("sortPrice");
  const resetBtn = document.getElementById("resetBtn");
  const detailModal = document.getElementById("detailModal");
  const modalContent = document.getElementById("modalContent");
  const totalInfo = document.getElementById("totalInfo");
  const filterStatus = document.getElementById("filterStatus");
  const lastUpdateEl = document.getElementById("lastUpdate");
  const refreshTimerEl = document.getElementById("refreshTimer");

  const F = {
    get(obj, ...keys) {
      for (const k of keys) {
        if (obj && obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== "") return obj[k];
      }
      return "";
    },
    normStatus(v) { return String(v || "").trim().toUpperCase(); },
    parseRupiahToInt(v) {
      const num = parseInt(String(v || "").replace(/[^\d]/g, ""), 10);
      return isNaN(num) ? 0 : num;
    },
    formatRupiah(v) {
      const n = this.parseRupiahToInt(v);
      return n ? (n/1000000).toFixed(0) + " Jt" : "-";
    },
    formatFullRupiah(v) {
      const n = this.parseRupiahToInt(v);
      return n ? "Rp " + n.toLocaleString("id-ID") : "Rp -";
    }
  };

  function keyMap(item) {
    const nama = F.get(item, 'MERK/TYPE MOBIL', 'MERK / TYPE MOBIL', 'MERK & TYPE', 'MERK', 'TYPE', 'NAMA', 'NAMA MOBIL');
    const nopol = F.get(item, 'NOPOL', 'NO POL', 'PLAT', 'PLAT NOMOR');
    const harga = F.get(item, 'HARGA JUAL (OTR)', 'HARGA OTR', 'HARGA', 'PRICE');
    const status = F.normStatus(F.get(item, 'STATUS', 'Status', 'status'));
    const bulan = F.get(item, 'BULAN', 'Bulan', 'bulan');
    const linkPhoto = F.get(item, 'LINK PHOTO', 'FOTO', 'PHOTO');
    const bank = {
      MUF: F.get(item, 'MUF'), ADIRA: F.get(item, 'ADIRA'), OTO: F.get(item, 'OTO'),
      SINARMAS: F.get(item, 'SINARMAS'), 'WOORI FINANCE': F.get(item, 'WOORI FINANCE'), 'CIMB NIAGA': F.get(item, 'CIMB NIAGA', 'CIMB')
    };
    const photos = [];
    if (linkPhoto) photos.push(linkPhoto);
    for (let j = 1; j <= 10; j++) {
      const v = F.get(item, `PHOTO ${j}`);
      if (v) photos.push(v);
    }
    return { nama, nopol, harga, status, bulan, bank, photos };
  }

  function applyFilter() {
    const source = allData.map(keyMap);
    filteredData = source.filter(x => {
      const search = searchText.toLowerCase();
      const matchSearch = x.nama.toLowerCase().includes(search) || x.nopol.toLowerCase().includes(search);
      const matchStatus = selectedStatus === "" || x.status === selectedStatus;
      return matchSearch && matchStatus;
    });

    if (currentSort) {
      filteredData.sort((a, b) => {
        const A = F.parseRupiahToInt(a.harga);
        const B = F.parseRupiahToInt(b.harga);
        return currentSort === "asc" ? A - B : B - A;
      });
    }

    const ready = filteredData.filter(x => x.status === 'READY').length;
    const booking = filteredData.filter(x => x.status === 'BOOKING').length;

    totalInfo.innerHTML = `
      <div class="READY status-badge shadow-sm">READY ${ready}</div>
      <div class="BOOKING status-badge shadow-sm">BOOKING ${booking}</div>
    `;

    listContainer.innerHTML = "";
    currentIndex = 0;
    endMessage.classList.add("hidden");
    loadMore();
  }

  function loadMore() {
    if (isLoading) return;
    isLoading = true;
    loading.classList.remove("hidden");

    const nextData = filteredData.slice(currentIndex, currentIndex + perLoad);
    
    nextData.forEach((item) => {
      const card = document.createElement("div");
      card.className = "bg-white rounded-2xl overflow-hidden flex flex-row p-3 gap-4 border border-gray-100 shadow-sm active:bg-gray-50 transition-all cursor-pointer";
      card.onclick = () => showModal(item);

      const photo = item.photos[0] || "https://via.placeholder.com/400x300?text=Katalog+Motor";

      card.innerHTML = `
        <div class="w-24 h-24 rounded-xl bg-gray-100 shrink-0 overflow-hidden border border-gray-50">
          <img data-src="${photo}" class="lazy-image w-full h-full object-cover opacity-0 transition-opacity duration-500" />
        </div>
        <div class="flex flex-col justify-between min-w-0 flex-1">
          <div>
            <div class="flex justify-between items-start">
               <h2 class="text-[13px] font-bold text-gray-900 line-clamp-2 uppercase leading-tight pr-2">${item.nama || 'Unit Tanpa Nama'}</h2>
               <span class="status-badge ${item.status}">${item.status}</span>
            </div>
            <p class="text-[10px] font-bold text-gray-400 mt-1 uppercase tracking-tighter">PLAT ${item.nopol || '-'}</p>
          </div>
          <div class="flex items-end justify-between">
            <div class="text-blue-700 font-extrabold text-lg">${F.formatRupiah(item.harga)}</div>
            <div class="text-[9px] font-bold text-gray-300 uppercase">Detail &rsaquo;</div>
          </div>
        </div>
      `;
      listContainer.appendChild(card);
    });

    initLazyLoad();
    currentIndex += perLoad;
    isLoading = false;
    loading.classList.add("hidden");

    if (currentIndex >= filteredData.length && filteredData.length > 0) {
      endMessage.classList.remove("hidden");
    }
  }

  function initLazyLoad() {
    const lazyImages = document.querySelectorAll("img.lazy-image");
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          img.onload = () => img.classList.add("opacity-100");
          obs.unobserve(img);
        }
      });
    }, { rootMargin: "200px" });
    lazyImages.forEach(img => observer.observe(img));
  }

  function showModal(item) {
    const slides = item.photos.map(src => `
      <div class="swiper-slide h-[300px] bg-gray-100">
        <img data-src="${src}" class="lazy-image object-cover w-full h-full" />
      </div>
    `);

    modalContent.innerHTML = `
      <div class="relative pb-10">
        <div class="swiper galeriSales">
          <div class="swiper-wrapper">${slides.length ? slides.join("") : '<div class="swiper-slide h-[300px] flex items-center justify-center bg-gray-100 text-gray-400 text-xs">Foto Tidak Tersedia</div>'}</div>
          <div class="swiper-pagination"></div>
        </div>

        <div class="px-6 pt-6">
          <div class="flex items-center gap-2 mb-3">
             <span class="status-badge ${item.status}">${item.status}</span>
             <span class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest">UNIT INVENTORY</span>
          </div>
          
          <h2 class="text-xl font-bold text-gray-900 uppercase leading-snug mb-4">${item.nama || '-'}</h2>
          
          <!-- Harga Card -->
          <div class="price-tag p-5 rounded-2xl text-white shadow-lg shadow-blue-100 mb-6">
            <p class="text-[10px] font-bold text-blue-100 uppercase tracking-widest mb-1 opacity-80">Harga Jual (OTR)</p>
            <div class="text-2xl font-black">${F.formatFullRupiah(item.harga)}</div>
          </div>

          <!-- Spek Ringkas Sales -->
          <div class="grid grid-cols-2 gap-2 mb-8">
            <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
              <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Nomor Polisi</p>
              <p class="text-xs font-bold text-gray-800">${item.nopol || '-'}</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
              <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Masa Pajak</p>
              <p class="text-xs font-bold text-gray-800">${item.bulan || '-'}</p>
            </div>
          </div>
          
          <!-- Sales Credit Guide -->
          <div class="mb-8">
            <h3 class="text-[10px] font-black text-gray-900 mb-4 uppercase tracking-[0.2em] flex items-center gap-2">
              <div class="w-1 h-3 bg-blue-600 rounded-full"></div> Estimasi Leasing
            </h3>
            <div class="space-y-2">
               ${Object.entries(item.bank).map(([name, val]) => val ? `
                 <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100">
                   <span class="text-[11px] font-black text-blue-700">${name}</span>
                   <span class="text-[11px] font-medium text-gray-600">${val}</span>
                 </div>
               ` : '').join('')}
            </div>
          </div>

          <!-- Sales Actions -->
          <div class="grid grid-cols-5 gap-3">
            <button id="copyBtn" class="col-span-1 bg-gray-100 text-gray-600 rounded-2xl py-4 flex items-center justify-center active:scale-95 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
              </svg>
            </button>
            <button id="shareWABtn" class="col-span-4 bg-green-500 text-white rounded-2xl py-4 font-bold text-xs shadow-lg shadow-green-100 active:scale-95 transition flex items-center justify-center gap-2 uppercase tracking-wider">
              Share Katalog Ke Konsumen
            </button>
          </div>
        </div>
      </div>
    `;

    document.getElementById("copyBtn").onclick = () => copyUnit(item);
    document.getElementById("shareWABtn").onclick = () => shareWA(item);
    
    document.getElementById("closeModalInner").onclick = hideModal;
    detailModal.onclick = (e) => { if (e.target === detailModal) hideModal(); };

    new Swiper('.galeriSales', { 
      slidesPerView: 1, 
      pagination: { el: '.swiper-pagination', clickable: true },
      observer: true,
      observeParents: true
    });

    detailModal.classList.remove("hidden");
    detailModal.classList.add("flex");
    initLazyLoad();
  }

  function hideModal() {
    detailModal.classList.add("hidden");
    detailModal.classList.remove("flex");
  }

  function shareWA(item) {
    let creditText = "";
    Object.entries(item.bank).forEach(([bankName, val]) => {
      if (val) creditText += `\n- ${bankName}: ${val}`;
    });

    const text = `Halo, ini katalog unit *${item.nama}* di Raffasya Motor.\n\nHarga OTR: *${F.formatFullRupiah(item.harga)}*\nNopol: ${item.nopol || '-'}\n\n*Estimasi Cicilan:*${creditText || '\n- Hubungi Sales untuk detail'}\n\nInformasi lebih lanjut hubungi saya segera!`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }

  function copyUnit(item) {
    let creditText = "";
    Object.entries(item.bank).forEach(([bankName, val]) => {
      if (val) creditText += `\n- ${bankName}: ${val}`;
    });

    const text = `Unit: ${item.nama}\nHarga: ${F.formatFullRupiah(item.harga)}\nNopol: ${item.nopol || '-'}\n\nEstimasi Cicilan:${creditText || '\n- Hubungi Sales'}`;
    
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    
    // Show custom toast
    const toast = document.getElementById("copyToast");
    toast.style.opacity = "1";
    setTimeout(() => { toast.style.opacity = "0"; }, 2000);
  }

  let refreshTimer;
  let countdown = REFRESH_INTERVAL / 1000;

  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    countdown = REFRESH_INTERVAL / 1000;
    refreshTimer = setInterval(() => {
      countdown--;
      refreshTimerEl.innerText = `Update in ${countdown}s`;
      if (countdown <= 0) {
        fetchData(true); 
        countdown = REFRESH_INTERVAL / 1000;
      }
    }, 1000);
  }

  async function fetchData(isSilent = false) {
    if (!isSilent) loading.classList.remove("hidden");
    try {
      const res = await fetch(apiURL);
      const json = await res.json();
      const rows = Array.isArray(json) ? json : (json.data || json.records || []);
      allData = rows.slice().reverse();
      const now = new Date();
      lastUpdateEl.innerText = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
    } catch (err) {
      console.error(err);
    } finally {
      applyFilter();
      if (!isSilent) loading.classList.add("hidden");
    }
  }

  window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
      if (currentIndex < filteredData.length) loadMore();
    }
  });

  searchInput.addEventListener("input", () => { searchText = searchInput.value; applyFilter(); });
  sortPrice.addEventListener("change", () => { currentSort = sortPrice.value; applyFilter(); });
  filterStatus.addEventListener("change", () => { selectedStatus = filterStatus.value; applyFilter(); });
  resetBtn.addEventListener("click", () => {
    searchText = ""; currentSort = ""; selectedStatus = "";
    searchInput.value = ""; sortPrice.value = ""; filterStatus.value = "";
    applyFilter();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  fetchData();
  startAutoRefresh();
</script>
</body>
</html>
